<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <title>AI 智能预测</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a2e;
            font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', 'SF Pro Display', system-ui, sans-serif;
        }
        
        /* 加载页面 */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        #splash-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .splash-logo {
            width: 120px;
            height: 120px;
            border-radius: 28px;
            background: linear-gradient(145deg, #4a90d9, #7c5cbf);
            box-shadow: 0 20px 60px rgba(74, 144, 217, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            animation: pulse 2s ease-in-out infinite;
        }
        .splash-logo span {
            font-size: 52px;
            font-weight: 700;
            color: white;
            letter-spacing: 2px;
        }
        .splash-title {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .splash-subtitle {
            font-size: 16px;
            color: rgba(255,255,255,0.6);
            margin-bottom: 40px;
        }
        .loader {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #4a90d9;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* 错误页面 */
        #error-page {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a2e;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9998;
            color: white;
            padding: 40px;
        }
        #error-page .error-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        #error-page h2 {
            font-size: 22px;
            margin-bottom: 10px;
        }
        #error-page p {
            font-size: 15px;
            color: rgba(255,255,255,0.6);
            margin-bottom: 30px;
            text-align: center;
        }
        #error-page button {
            background: linear-gradient(145deg, #4a90d9, #7c5cbf);
            color: white;
            border: none;
            padding: 14px 40px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        #error-page button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <!-- 启动屏 -->
    <div id="splash-screen">
        <div class="splash-logo"><span>AI</span></div>
        <div class="splash-title">AI 智能预测</div>
        <div class="splash-subtitle">智能预测 · 数据分析</div>
        <div class="loader"></div>
    </div>
    
    <!-- 错误页面 -->
    <div id="error-page">
        <div class="error-icon">📡</div>
        <h2>网络连接异常</h2>
        <p>请检查您的网络连接后重试</p>
        <button onclick="reloadApp()">重新加载</button>
    </div>
    
    <script>
        var splash = document.getElementById('splash-screen');
        var errorPage = document.getElementById('error-page');
        var loadTimer = null;
        var TARGET_URL = 'https://morgan666.top/';
        
        // 显示启动屏至少 2 秒，然后直接导航到目标网站
        // 使用直接导航（非 iframe）以支持复制、粘贴等原生功能
        
        function navigateToSite() {
            splash.classList.add('hidden');
            setTimeout(function() {
                // 直接跳转到目标网站（非 iframe）
                // 这样剪贴板 API (navigator.clipboard) 可以正常工作
                window.location.href = TARGET_URL;
            }, 500);
        }
        
        function showError() {
            splash.style.display = 'none';
            errorPage.style.display = 'flex';
        }
        
        function reloadApp() {
            errorPage.style.display = 'none';
            splash.style.display = 'flex';
            splash.classList.remove('hidden');
            navigateToSite();
        }
        
        // 启动屏显示至少 2 秒，如果网站在此期间加载完成则提前跳转
        var startTime = Date.now();
        var minSplashTime = 2000; // 最小启动屏时间
        
        // 监听 Cordova 就绪
        document.addEventListener('deviceready', function() {
            var elapsed = Date.now() - startTime;
            var remaining = Math.max(0, minSplashTime - elapsed);
            
            setTimeout(function() {
                navigateToSite();
            }, remaining);
        }, false);
        
        // 如果 deviceready 没触发（比如非 Cordova 环境），3 秒后自动跳转
        setTimeout(function() {
            var elapsed = Date.now() - startTime;
            if (elapsed >= 2000) {
                navigateToSite();
            }
        }, 3000);
        
        // 加载超时：10 秒后如果页面还没加载完成（但已经跳转了），显示错误
        // 注意：window.location.href 跳转后，当前页面的脚本会继续执行一小段时间
        // 所以这里用 onbeforeunload 检测跳转
        window.addEventListener('beforeunload', function() {
            // 页面即将跳转，清理定时器
            clearTimeout(loadTimer);
        });
    </script>
</body>
</html>
