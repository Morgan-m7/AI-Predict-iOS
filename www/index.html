<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <title>AI 智能预测</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a2e;
            font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', 'SF Pro Display', system-ui, sans-serif;
        }
        
        /* 加载页面 */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        #splash-screen.hidden {
            opacity: 0;
            transform: scale(1.1);
            pointer-events: none;
        }
        
        .splash-logo {
            width: 120px;
            height: 120px;
            border-radius: 28px;
            background: linear-gradient(145deg, #4a90d9, #7c5cbf);
            box-shadow: 0 20px 60px rgba(74, 144, 217, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            animation: pulse 2s ease-in-out infinite;
        }
        .splash-logo span {
            font-size: 52px;
            font-weight: 700;
            color: white;
            letter-spacing: 2px;
        }
        .splash-title {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .splash-subtitle {
            font-size: 16px;
            color: rgba(255,255,255,0.6);
            margin-bottom: 40px;
        }
        .loader {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #4a90d9;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* WebView 容器 */
        #webview-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        #webview-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        /* 错误页面 */
        #error-page {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a2e;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9998;
            color: white;
            padding: 40px;
        }
        #error-page .error-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        #error-page h2 {
            font-size: 22px;
            margin-bottom: 10px;
        }
        #error-page p {
            font-size: 15px;
            color: rgba(255,255,255,0.6);
            margin-bottom: 30px;
            text-align: center;
        }
        #error-page button {
            background: linear-gradient(145deg, #4a90d9, #7c5cbf);
            color: white;
            border: none;
            padding: 14px 40px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        #error-page button:active {
            transform: scale(0.95);
        }
        
        /* 底部安全区域 */
        .safe-area-bottom {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: env(safe-area-inset-bottom, 0);
            background: transparent;
            z-index: 1;
        }
    </style>
</head>
<body>
    <!-- 启动屏 -->
    <div id="splash-screen">
        <div class="splash-logo"><span>AI</span></div>
        <div class="splash-title">AI 智能预测</div>
        <div class="splash-subtitle">智能预测 · 数据分析</div>
        <div class="loader"></div>
    </div>
    
    <!-- WebView 容器 -->
    <div id="webview-container">
        <iframe id="app-frame" src="https://morgan666.top/" allow="geolocation *; microphone *; camera *"></iframe>
    </div>
    
    <!-- 错误页面 -->
    <div id="error-page">
        <div class="error-icon">📡</div>
        <h2>网络连接异常</h2>
        <p>请检查您的网络连接后重试</p>
        <button onclick="reloadApp()">重新加载</button>
    </div>
    
    <!-- 安全区域 -->
    <div class="safe-area-bottom"></div>
    
    <script>
        var iframe = document.getElementById('app-frame');
        var splash = document.getElementById('splash-screen');
        var errorPage = document.getElementById('error-page');
        var loadTimer = null;
        var hasLoaded = false;
        
        // 监听 iframe 加载完成
        iframe.addEventListener('load', function() {
            hasLoaded = true;
            clearTimeout(loadTimer);
            hideSplash();
        });
        
        // 加载超时处理（10秒）
        loadTimer = setTimeout(function() {
            if (!hasLoaded) {
                showError();
            }
        }, 10000);
        
        function hideSplash() {
            splash.classList.add('hidden');
            setTimeout(function() {
                splash.style.display = 'none';
            }, 600);
        }
        
        function showError() {
            splash.style.display = 'none';
            errorPage.style.display = 'flex';
        }
        
        function reloadApp() {
            errorPage.style.display = 'none';
            splash.style.display = 'flex';
            splash.classList.remove('hidden');
            hasLoaded = false;
            
            iframe.src = iframe.src;
            
            loadTimer = setTimeout(function() {
                if (!hasLoaded) {
                    showError();
                }
            }, 10000);
        }
        
        // 监听 Cordova 就绪事件
        document.addEventListener('deviceready', function() {
            // 如果5秒内 iframe 还没加载，用默认超时
            setTimeout(function() {
                if (!hasLoaded) {
                    showError();
                }
            }, 15000);
        }, false);
    </script>
</body>
</html>
