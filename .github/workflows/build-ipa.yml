name: 构建 IPA

on:
  workflow_dispatch:    # 手动触发
  push:
    branches: [ main ]

jobs:
  build:
    name: 构建 iOS IPA
    runs-on: macos-latest   # 使用 GitHub 免费提供的 macOS 云服务器

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: |
          npm install
          npm install -g cordova

      - name: 添加 iOS 平台
        run: cordova platform add ios --no-resources

      - name: 移除签名配置（适配 TrollStore/巨魔）
        run: |
          PROJECT_FILE="platforms/ios/App.xcodeproj/project.pbxproj"
          
          # 清除所有 DEVELOPMENT_TEAM 设置
          sed -i '' 's/DEVELOPMENT_TEAM = "[^"]*"/DEVELOPMENT_TEAM = ""/g' "$PROJECT_FILE"
          sed -i '' 's/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = "";/g' "$PROJECT_FILE"
          
          # 清除代码签名身份
          sed -i '' 's/CODE_SIGN_IDENTITY = "[^"]*"/CODE_SIGN_IDENTITY = ""/g' "$PROJECT_FILE"
          sed -i '' 's/CODE_SIGN_IDENTITY = [^;]*;/CODE_SIGN_IDENTITY = "";/g' "$PROJECT_FILE"
          sed -i '' 's/"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "[^"]*"/"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = ""/g' "$PROJECT_FILE"
          
          # 允许不签名
          sed -i '' 's/CODE_SIGNING_ALLOWED = NO/CODE_SIGNING_ALLOWED = YES/g' "$PROJECT_FILE"
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES/CODE_SIGNING_REQUIRED = NO/g' "$PROJECT_FILE"
          
          echo "✅ 签名配置已移除"

      - name: 构建 iOS 应用
        run: |
          # 使用 xcodebuild 直接构建，完全禁止签名
          cd platforms/ios
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -configuration Debug \
                     -destination generic/platform=iOS \
                     -archivePath App.xcarchive \
                     archive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     DEVELOPMENT_TEAM="" \
                     PROVISIONING_PROFILE_SPECIFIER="" \
                     | xcpretty || true
          echo "✅ 构建完成"

      - name: 导出未签名 IPA
        run: |
          cd platforms/ios
          
          # 查找 .app 文件
          APP_PATH=$(find App.xcarchive -name "*.app" -type d | head -1)
          echo "找到 APP: $APP_PATH"
          
          # 创建 Payload 目录
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          
          # 生成未签名 IPA
          cd /Users/runner/work/AI-Predict-iOS/AI-Predict-iOS
          zip -r AI智能预测.ipa platforms/ios/Payload/
          
          echo "✅ IPA 文件已生成"
          ls -lh AI智能预测.ipa || echo "IPA 文件未生成！"

      - name: 上传 IPA 为构建产物
        uses: actions/upload-artifact@v4
        with:
          name: AI智能预测-IPA
          path: AI智能预测.ipa
          if-no-files-found: error

      - name: 上传 dSYM（调试信息）
        uses: actions/upload-artifact@v4
        with:
          name: AI智能预测-dSYM
          path: platforms/ios/build/**/*.dSYM
          if-no-files-found: ignore
